<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nisaab • Chat</title>

    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Nisaab" />
    <link rel="manifest" href="/static/site.webmanifest" />    
</head>


<body class="chat-page">

<div class="chat-header">

    <div class="chat-brand">

        <div>
            <h1 class="wordmark-sm">
                Nisaab
            </h1>

            <p class="chat-status">
                AI financial assistant
            </p>
        </div>

    </div>


    <a href="/dashboard" class="back-link">
        ← Dashboard
    </a>

</div>


<div id="messages" class="messages">

    <div class="bot message">
        Welcome back.

        I'm Nisaab, your personal finance assistant.
        You can ask me about your balance, expenses,
        transactions, or budgeting.
    </div>

</div>


<div class="input-bar">

    <div class="input-area">

        <input
            id="message"
            placeholder="Ask Nisaab..."
            onkeydown="if(event.key === 'Enter') sendMessage()"
        >

        <button aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M5 12L19 5L12 19L11 13L5 12Z"
                fill="currentColor"/>
            </svg>
        </button>
    </div>

</div>


<script src="/static/app.js"></script>

</body>

</html>
