<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5L123LXQ6Y"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-5L123LXQ6Y');
    </script>

    <title>Nisaab Dashboard</title>

    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Nisaab" />
    <link rel="manifest" href="/static/site.webmanifest" />
</head>


<body class="dashboard-page">

<div class="dashboard">

    <div class="dashboard-header">

        <div>
            <p class="dashboard-label">
                Financial overview
            </p>

            <h1 class="wordmark-sm">
                Nisaab
            </h1>
        </div>


        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </div>


    <section class="welcome-card">

        <div class="avatar">
            N
        </div>

        <div class="welcome-text">

            <h3 id="welcome">
                Loading...
            </h3>

            <p id="user-email"></p>

        </div>

    </section>


    <section class="balance-card">

        <p class="dashboard-label">
            Current balance
        </p>

        <span id="balance">
            Loading...
        </span>

    </section>


    <div class="summary-grid">


        <section class="finance-card">

            <p class="dashboard-label">
                Income
            </p>

            <span id="income">
                Loading...
            </span>

        </section>


        <section class="finance-card">

            <p class="dashboard-label">
                Expenses
            </p>

            <span id="expenses">
                Loading...
            </span>

        </section>


    </div>


    <section class="finance-card">

        <h3>
            Spending by Category
        </h3>

        <div id="category-breakdown">
            Loading...
        </div>

    </section>



    <section class="finance-card">

        <h3>
            Recent Transactions
        </h3>

        <div id="transactions">
            Loading...
        </div>

    </section>



    <button class="chat-btn" onclick="openChat()">
        Chat with Nisaab
    </button>


</div>


<script src="/static/app.js"></script>

<script>
requireAuth();
loadDashboard();
</script>

</body>

</html>
