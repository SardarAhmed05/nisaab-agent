<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nisaab • Login</title>

    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Nisaab" />
    <link rel="manifest" href="/static/site.webmanifest" />
</head>

<body>

<div class="container">

    <div class="card">

        <h1 class="wordmark">Nisaab</h1>
        <p class="tagline">Know exactly where you stand.</p>

        <input id="email" type="email" placeholder="Email or username">

        <div class="password-wrapper">
            <input id="password" type="password" placeholder="Password">
            <button type="button" class="toggle-password" onclick="togglePassword('password', this)">👁</button>
        </div>

        <button onclick="login()">
            Log in
        </button>

        <p id="error" class="error"></p>

        <p>
            Don't have an account?
            <a href="/signup">
                Sign up
            </a>
        </p>

    </div>

</div>

<script src="/static/app.js"></script>

</body>
</html>
